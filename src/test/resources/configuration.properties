#Scanner configuration
class.loader.reject-packages=org.*,com.sun.*,java.*,javax.*,io.netty.*,org.springframework.*,net.bytebuddy.*,com.fasterxml.*,org.apache.*,org.junit.*,org.hamcrest.*,org.mockito.*,com.google.*,org.slf4j.*,ch.qos.logback.*,org.seleniumhq.*,net.serenitybdd.*,io.restassured.*,com.browserup.*,org.json.*,org.yaml.*,com.jayway.*,org.objenesis.*,net.sf.*,org.w3c.*,org.xml.*,com.squareup.*,okhttp3.*,retrofit2.*,com.github.*,io.github.classgraph.*,io.github.bonigarcia.*,org.jetbrains.*,kotlin.*,kotlinx.*
class.loader.enable-parallel-scanning=false
class.loader.buffer-size=33554432
class.loader.default-scan-locations=io.github.ygrip
class.loader.scan-locations.request-data=io.github.ygrip
class.loader.scan-locations.response-data=io.github.ygrip
#Validator Helper configuration
validator.helper.scan-locations=io.github.ygrip
validator.helper.scan-timeout=5
automation.config.template-folder=/src/test/resources/templates/
#--------------------------------------------
#Engine setting
#--------------------------------------------
automation.engine.default-engine=playwright
automation.engine.active-engines=playwright
automation.engine.screenshot-strategy=ON_EACH_STEP
automation.engine.screenshot-output-type=VIDEO
automation.engine.screenshot-fps=30
automation.engine.force-resolution=true
automation.engine.video-bit-rate=10
#--------------------------------------------
#Driver setting
#--------------------------------------------
playwright.browser.scan-locations=io.github.ygrip
playwright.browser.page-scan-locations=io.github.ygrip
playwright.browser.action-scan-locations=io.github.ygrip
playwright.browser.owner=Automation Framework
playwright.browser.enable-fallback=true
playwright.browser.enable-web-socket=true
playwright.browser.maximize-browser=true
playwright.browser.headless=false
#--------------------------------------------
#Browser Version Setting
#--------------------------------------------
playwright.browser.version.chrome=
playwright.browser.version.firefox=
playwright.browser.version.edge=
#--------------------------------------------
#Remote web driver setting
#--------------------------------------------
playwright.browser.remote-driver.default.enabled=false
playwright.browser.remote-driver.default.uri=http://localhost:4444/
playwright.browser.remote-driver.default.enable-vnc=true
playwright.browser.remote-driver.default.enable-video=false
#--------------------------------------------
#Remote driver for appium setting
#--------------------------------------------
playwright.browser.remote-driver.android.enabled=true
playwright.browser.remote-driver.android.uri=http://0.0.0.0:4723/wd/hub/
playwright.browser.remote-driver.android.startServer=true
playwright.browser.remote-driver.ios.enabled=true
playwright.browser.remote-driver.ios.uri=http://0.0.0.0:4723/wd/hub/
playwright.browser.remote-driver.ios.startServer=true
#--------------------------------------------
#Proxy Setting
#--------------------------------------------
playwright.browser.standalone-proxy-url=http://localhost:9091/
proxy.mitmproxy-api-url=http://localhost:8090/
#--------------------------------------------
#User Agent Setting
#--------------------------------------------
playwright.browser.user-agent.desktop.chrome=Mozilla/5.0 (Macintosh; Intel Mac OS X 10.15; rv:148.0) Gecko/20100101 Firefox/148.0
playwright.browser.user-agent.desktop.firefox=Mozilla/5.0 (Windows NT 10.0; Win64; x64; rv:92.0) Gecko/20100101 Firefox/92.0
playwright.browser.user-agent.mobile.firefox=Mozilla/5.0 (Linux; Android 8.0.0; Pixel 2 XL Build/OPD1.170816.004) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/67.0.3396.87 Mobile Safari/537.36
playwright.browser.user-agent.mobile.chrome=Mozilla/5.0 (Linux; Android 8.0; Pixel 2 Build/OPD3.170816.012) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/93.0.4577.82 Mobile Safari/537.36
playwright.browser.user-agent.mobile.edge=Mozilla/5.0 (Linux; Android 6.0; Nexus 5 Build/MRA58N) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/92.0.4515.159 Mobile Safari/537.36 Edg/92.0.902.78
#--------------------------------------------
#Emulation Setting
#--------------------------------------------
playwright.browser.emulation.mobile.firefox.dimension.width=360
playwright.browser.emulation.mobile.firefox.dimension.height=720
playwright.browser.emulation.mobile.firefox.dimension.pixelRatio=3.0
playwright.browser.emulation.mobile.firefox.adjust-dimension=true
playwright.browser.emulation.mobile.firefox.device-name=
playwright.browser.emulation.mobile.chrome.dimension.width=360
playwright.browser.emulation.mobile.chrome.dimension.height=720
playwright.browser.emulation.mobile.chrome.dimension.pixelRatio=3.0
playwright.browser.emulation.mobile.chrome.adjust-dimension=false
playwright.browser.emulation.mobile.chrome.device-name=Nexus 5
playwright.browser.emulation.mobile.opera.dimension.width=360
playwright.browser.emulation.mobile.opera.dimension.height=720
playwright.browser.emulation.mobile.opera.dimension.pixelRatio=3.0
playwright.browser.emulation.mobile.opera.adjust-dimension=true
playwright.browser.emulation.mobile.opera.device-name=Nexus 5
playwright.browser.emulation.mobile.edge.dimension.width=360
playwright.browser.emulation.mobile.edge.dimension.height=720
playwright.browser.emulation.mobile.edge.dimension.pixelRatio=3.0
playwright.browser.emulation.mobile.edge.adjust-dimension=false
playwright.browser.emulation.mobile.edge.device-name=
#--------------------------------------------
#Driver Capabilities Setting
#--------------------------------------------
#Mobile Chrome
playwright.browser.args.mobile.chrome.[0]=--remote-allow-origins=*
playwright.browser.capabilities.mobile.chrome.real_mobile=true
#Desktop Chrome
playwright.browser.args.desktop.chrome.[0]=--remote-allow-origins=*